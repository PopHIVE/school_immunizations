on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  process:
    # Pinned, not ubuntu-latest: on 2026-10-27 that label moved to Ubuntu
    # 26.04, which has no Posit binaries and a GCC 15 that cannot compile the
    # readxl / systemfonts / textshaping / ragg versions in renv.lock. Move
    # off 24.04 only after updating those packages in the lockfile.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - run: sudo apt-get update
      - run: sudo apt-get install -y libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libudunits2-dev libproj-dev libgdal-dev libgeos-dev cmake libnode-dev libpoppler-cpp-dev
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'  # Use stable 4.4.x instead of 4.5.2
          use-public-rspm: true      
      - uses: r-lib/actions/setup-renv@v2
      - run: Rscript -e "renv::install('dissc-yale/dcf')"
        env:
          # authenticated GitHub API calls; unauthenticated ones hit the rate
          # limit and the install failed on 2026-09-13
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - run: Rscript scripts/build.R
      # dcf_build() records a failed ingest in that state's process.json and
      # carries on, so the build step itself never fails. build_status.R
      # reads every process.json, writes data/BUILD_STATUS.md, and exits
      # non-zero when an ingest failed or a download failed with no
      # committed file to fall back on. The commit still happens first so
      # the status table and any partial data land in the repo.
      - id: status
        run: |
          set +e
          Rscript scripts/build_status.R
          echo "exit=$?" >> $GITHUB_OUTPUT
      - id: diff
        run: |
          if git diff --exit-code; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - if: ${{ steps.diff.outputs.changed == 'true' }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "scheduled data build"
          # the weekly source check may have pushed in the meantime
          git pull --rebase origin ${{ github.ref_name }}
          git push
      - if: ${{ steps.status.outputs.exit != '0' }}
        run: |
          echo "One or more ingests or downloads failed; see data/BUILD_STATUS.md"
          exit 1
